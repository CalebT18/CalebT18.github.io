<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>

        html, body {
    height: 100%;
    overflow: hidden;
}

         .fall {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .fall img{
            position: absolute;
            top: -100;
            width: 50;
            animation: fallAnim 6s linear infinite;
        }

        .fall img:nth-child(1) { left: 10%; animation-delay: 0s; }
        .fall img:nth-child(2) { left: 30%; animation-delay: 1s; }
        .fall img:nth-child(3) { left: 50%; animation-delay: 2s; }
        .fall img:nth-child(4) { left: 70%; animation-delay: 3s; }
        .fall img:nth-child(5) { left: 90%; animation-delay: 4s; }

        @keyframes fallAnim{
            0%{
                transform: translateY(-100);
                opacity: 1;
            }
            100%{
                transform: translateY(110vh);
                opacity: 0.7;
            }
        }
        img {
            border-radius: 25px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-top: 100px;
            width: 900px;
            height: auto;
        }

        body{
            background-image: url(Images/\ -13.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .cute-back-btn {
            display: inline-block;
            padding: 14px 32px;
            font-size: 1.3em;
            color: #fff;
            background: linear-gradient(90deg, #ffb6e6 0%, #ffd6e0 100%);
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 16px rgba(255,182,230,0.3);
            cursor: pointer;
            position: fixed;
            top: 30px;
            left: 30px;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            transition: transform 0.1s;
        }
        .cute-back-btn:hover {
            transform: scale(1.08) rotate(-3deg);
            background: linear-gradient(90deg, #ffd6e0 0%, #ffb6e6 100%);
            box-shadow: 0 8px 24px rgba(255,182,230,0.5);
        }
        .cute-back-btn::before {
            content: "← ";
            font-size: 1.2em;
        }
        .cute-back-btn::after {
            content: " 💖";
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <button class="cute-back-btn" onclick="window.history.back()">Back</button>
    <div style="position: relative; width: 900px; margin: 0 auto;">
        <img src="Images/scroll.jpg" alt="scroll" style="width: 100%; height: auto; border-radius: 25px; margin-top: 100px;">
        <div style="position: absolute; top: 20%; left: 10%; width: 80%; height: 60%; display: flex; align-items: center; justify-content: center;">
            <p style="text-align: center; font-size: 2em; color: black; text-shadow: none; margin: 0;">

            </p>
        </div>
    </div>
    <img src="Images/scroll.jpg" alt="scroll">

</body>
</html>
