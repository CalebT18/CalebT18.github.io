<html lang="en">
<head>
    <link rel="icon" type="image/png" href="Images/loveislandlogo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏝️Pick Your Islanders🏝️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f9f9f9;
            margin: 0;
        }

        .Home {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #ffc0cb;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
            font-weight: bold;
        }

        .Home:hover {
            background-color: #ff1493;
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px #ff1493);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            background-color: #fff0f5;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        form {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: 'Montserrat', sans-serif;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
            background-color: #ff69b4;
            color: white;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
        }

        
        

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin: 10px 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn {
            margin-left: 10px;
            background: none;
            border: none;
            color: #ff1493;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .delete-btn:hover {
            color: red;
        }
    </style>
</head>
<body>
    <a href="index.html">
        <button class="Home">Home</button>
    </a>

    <div class="container">
        <h1>Pick Your Islanders🏝️</h1>

        <form id="Cast-Form">
            <input list="islanders-list" id="islander-input" name="islander" placeholder="Select an islander..." required>

            <datalist id="islanders-list">
                <!-- OG Islanders -->
                <option value="Ace">
                <option value="Amaya">
                <option value="Austin">
                <option value="Chelley">
                <option value="Huda">
                <option value="Nicolas">
                <option value="Olandria">
                <option value="Taylor">
                <option value="Cierra">
                <option value="Iris">
                <!-- Casa Amor / Bombshells -->
                <option value="Elan">
                <option value="Gracyn">
                <option value="Chris">
                <option value="Jaden">
                <option value="Savanna">
                <option value="Zac">
                <option value="Bryan">
                <option value="Zak">
                <option value="CoCo">
                <option value="Clarke">  
                <!-- Optional recent exit OGs -->
                <option value="Belle-A">
                <option value="Charlie">
                <option value="Jeremiah">
                <option value="Hannah">
                <option value="Yulissa">
            </datalist>

            <br><br>
            <button type="button">Random</button>
            <button type="button">Random Custom</button>
            <br><br>
            <button type="submit">Save Cast 💖</button>
        </form>

        <ul id="selected-islanders"></ul>
    </div>

    <script src="script.js"></script>

</body>
</html>
